<!doctype html>
<!--
  Fallback for "/". On Netlify the redirect rules in netlify.toml send visitors to /tr/, /de/, /es/
  or /en/ from their Accept-Language header before this file is served. Anywhere else
  (local previews, other hosts) this page picks the language from the browser instead.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MotionCore</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="/en/" />
    <link rel="alternate" hreflang="en" href="/en/" />
    <link rel="alternate" hreflang="tr" href="/tr/" />
    <link rel="alternate" hreflang="de" href="/de/" />
    <link rel="alternate" hreflang="es" href="/es/" />
    <link rel="alternate" hreflang="x-default" href="/en/" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <script>
      (function () {
        var supported = ["tr", "de", "es", "en"];
        var preferred = navigator.languages || [navigator.language || "en"];
        var target = "en";
        for (var i = 0; i < preferred.length; i++) {
          var code = String(preferred[i]).slice(0, 2).toLowerCase();
          if (supported.indexOf(code) !== -1) { target = code; break; }
        }
        location.replace("/" + target + "/" + location.hash);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/en/" /></noscript>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f1a; color: #f6f7f9; font-family: system-ui, sans-serif; }
      a { color: #ff5a55; margin: 0 0.5rem; }
    </style>
  </head>
  <body>
    <p>
      <a href="/en/">English</a>
      <a href="/tr/">Türkçe</a>
      <a href="/de/">Deutsch</a>
      <a href="/es/">Español</a>
    </p>
  </body>
</html>
